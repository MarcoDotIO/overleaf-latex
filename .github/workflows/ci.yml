name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run check
      - name: Check committed plugin bundle
        run: |
          if [ -n "$(git status --porcelain -- bundle)" ]; then
            git status --short -- bundle
            echo "::error::bundle/ does not match the source. Run npm run bundle and commit the result."
            exit 1
          fi

  claude-plugin:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate plugin and marketplace manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.117 plugin validate .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.117 plugin validate .
