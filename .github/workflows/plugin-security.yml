name: Plugin Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: HOL plugin scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: '.'
          mode: scan
          min_score: '80'
          fail_on_severity: high
          online: 'false'
          upload_sarif: 'false'
          trust_repository_policy: 'false'
          submission_enabled: 'false'
          pr_comment: 'off'
